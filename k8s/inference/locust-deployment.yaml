apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust
  template:
    metadata:
      labels:
        app: locust
    spec:
      containers:
        - name: locust
          image: locustio/locust:latest
          args:
            - "-f"
            - "/locust/locustfile.py"
            - "--host=http://fastapi-service:8000"
            - "--web-port=8089"
          ports:
            - containerPort: 8089
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8089
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: locust-scripts
              mountPath: /locust
      volumes:
        - name: locust-scripts
          configMap:
            name: locust-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: locust-config
  namespace: mlops
data:
  locustfile.py: |
    from locust import HttpUser, task, between

    SAMPLE_PAYLOAD = {
        "age": 3, "time_in_hospital": 5, "num_lab_procedures": 40,
        "num_procedures": 1, "num_medications": 10, "number_outpatient": 0,
        "number_emergency": 0, "number_inpatient": 1, "number_diagnoses": 7,
        "race_encoded": 1, "gender_encoded": 0, "admission_type_encoded": 1,
        "discharge_encoded": 1, "admission_source_encoded": 7,
        "a1c_result_encoded": 0, "metformin_encoded": 1, "insulin_encoded": 2
    }

    class DiabetesAPIUser(HttpUser):
        wait_time = between(0.5, 2)

        @task(3)
        def predict(self):
            self.client.post("/predict", json=SAMPLE_PAYLOAD)

        @task(1)
        def health(self):
            self.client.get("/health")

        @task(1)
        def model_info(self):
            self.client.get("/model-info")
---
apiVersion: v1
kind: Service
metadata:
  name: locust-service
  namespace: mlops
spec:
  selector:
    app: locust
  ports:
    - port: 8089
      targetPort: 8089
  type: ClusterIP
