apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: mlops
data:
  prometheus-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-service:9090
        access: proxy
        isDefault: true
        editable: false
  dashboards-provider.yaml: |
    apiVersion: 1
    providers:
      - name: mlops-dashboards
        orgId: 1
        folder: MLOps
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/dashboards
